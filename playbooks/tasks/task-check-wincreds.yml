- name: Validate credentials loop
  block:
    - name: Test domain user credentials
      win_ping:
      register: credential_test
      vars:
        ansible_user: "{{ ansible_user }}"
        ansible_password: "{{ ansible_password }}"
      ignore_errors: yes

    - name: Check if credentials are invalid
      fail:
        msg: "Die angegebenen Anmeldeinformationen sind ungültig. Bitte überprüfen und erneut versuchen."
      when: credential_test.failed and retry_count >= 3

    - name: Prompt for credentials again if invalid
      vars_prompt:
        - name: ansible_user
          prompt: "Admin (bsp. adminjs@gutingia.local)"
          private: false
        - name: ansible_password
          prompt: "Passwort"
          private: true
      when: credential_test.failed and retry_count < 3

    - name: Increment retry count
      set_fact:
        retry_count: "{{ retry_count + 1 }}"
      when: credential_test.failed
  rescue:
    - name: Stop playbook due to invalid credentials
      meta: end_play
  until: credential_test is succeeded