- name: Ensure directory exists
  ansible.builtin.file:
    path: /mnt/protokolle/{{ ansible_date_time.year }}/{{ ansible_date_time.month }}/Serverpatch/@work
    state: directory
    recurse: yes
  delegate_to: localhost

- name: Ensure log file exists
  ansible.builtin.file:
    path: /mnt/protokolle/{{ ansible_date_time.year }}/{{ ansible_date_time.month }}/Serverpatch/@work/Updates-{{ groupe_name }}-Generated.txt
    state: touch
  delegate_to: localhost

- name: Write log
  ansible.builtin.lineinfile:
    path: /mnt/protokolle/{{ ansible_date_time.year }}/{{ ansible_date_time.month }}/Serverpatch/@work/Updates-{{ groupe_name }}-Generated.txt
    line: |
      ---------------------------------------------------------------------------------------------------------------------------

      {{ inventory_hostname }} ({{ ansible_facts.os_name }}):
        Updates({{ update_result.found_update_count }}):
        {% for update in update_result.updates %}
         - {{ update_result.updates[update].title }}
        {% endfor %}
        
        Done: Neustart von {{ reboot_start.stdout }} bis {{ reboot_end.stdout }} = OK
        {{ windows_diskspace_check }}
        {{ windows_verson_check }}
        ToDo: WSUS Status prüfen =
        ToDo: Logs > Anwendung und System:
        {% for log in event_logs.stdout_lines %}
            Source: {{ log.Source }}
            Message: {{ log.Message }}
            
        {% endfor %}
        ToDo: Abmelden = 
        
  delegate_to: localhost