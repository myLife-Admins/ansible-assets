- name: Test WSUS Event Log Collection
  hosts: windows
  tasks:
    - name: Copy PowerShell script to the server
      win_copy:
        src: /opt/ansible-assets/powershell/scripts/Get-EventLogs.ps1
        dest: C:\Temp\Get-EventLogs.ps1

    - name: Run PowerShell script to get event logs of last 3 hours
      win_shell: powershell.exe -ExecutionPolicy Bypass -File C:\Temp\Get-EventLogs.ps1
      register: event_logs

    - name: Display collected event logs
      debug:
        var: event_logs.stdout